name: Build FFmpeg source bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-source-bundle:
    name: Build FFmpeg source bundle
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Application repository
      # ------------------------------------------------------

      - name: Checkout application repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Exact BtbN build system used for our FFmpeg binary
      # ------------------------------------------------------

      - name: Checkout exact BtbN FFmpeg-Builds revision
        uses: actions/checkout@v4
        with:
          repository: BtbN/FFmpeg-Builds
          ref: 590a6612d7d961e9258429e501619e0b7d7cbedf
          path: _ffmpeg_builds


      # ------------------------------------------------------
      # Free runner disk space
      # ------------------------------------------------------

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail

          df -h

          sudo apt-get clean
          docker system prune -a -f || true

          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/android

          df -h


      # ------------------------------------------------------
      # Docker
      # ------------------------------------------------------

      - name: Verify Docker
        shell: bash
        run: |
          set -euo pipefail

          docker --version
          docker info >/dev/null


      # ------------------------------------------------------
      # Prepare the BtbN base image
      #
      # download.sh expects:
      # ghcr.io/btbn/ffmpeg-builds/base:latest
      #
      # First try pulling it.
      # If GHCR refuses access or the image is unavailable,
      # build the exact base image locally from the checked-out
      # BtbN revision.
      # ------------------------------------------------------

      - name: Prepare BtbN download image
        shell: bash
        run: |
          set -euo pipefail

          cd _ffmpeg_builds

          BASE_IMAGE="ghcr.io/btbn/ffmpeg-builds/base:latest"

          echo "Required image:"
          echo "$BASE_IMAGE"
          echo

          if docker pull "$BASE_IMAGE"; then
            echo "BtbN base image downloaded successfully."
          else
            echo "Could not pull BtbN base image."
            echo "Building it locally from the exact BtbN revision..."

            export DOCKER_BUILDKIT=1

            docker build \
              --tag "$BASE_IMAGE" \
              images/base

            echo "Local BtbN base image created."
          fi

          docker image inspect "$BASE_IMAGE" >/dev/null


      # ------------------------------------------------------
      # Dependency sources
      #
      # IMPORTANT:
      #
      # GitHub Actions injects GITHUB_REPOSITORY with the name
      # of OUR repository. BtbN's util/vars.sh uses that value
      # when choosing the Docker image.
      #
      # Removing it in this subshell makes BtbN use its built-in
      # fallback:
      #
      # btbn/ffmpeg-builds
      # ------------------------------------------------------

      - name: Download dependency sources
        shell: bash
        run: |
          set -euo pipefail

          cd _ffmpeg_builds

          chmod +x download.sh

          (
            unset GITHUB_REPOSITORY

            echo "Running BtbN download.sh..."
            echo "GITHUB_REPOSITORY has been unset for this subprocess."
            echo

            ./download.sh
          )

          if [ ! -d ".cache/downloads" ]; then
            echo "BtbN download cache was not created."
            exit 1
          fi

          SOURCE_COUNT="$(
            find .cache/downloads \
              -type f \
              -name '*.tar.xz' \
              | wc -l
          )"

          echo
          echo "Downloaded source archives: $SOURCE_COUNT"
          echo

          find .cache/downloads \
            -type f \
            -name '*.tar.xz' \
            | sort

          if [ "$SOURCE_COUNT" -eq 0 ]; then
            echo "No dependency sources were downloaded."
            exit 1
          fi


      # ------------------------------------------------------
      # Exact FFmpeg source
      # ------------------------------------------------------

      - name: Download exact FFmpeg source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _ffmpeg_core_source

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/FFmpeg/FFmpeg/archive/852b0552f0.tar.gz" \
            --output "_ffmpeg_core_source/FFmpeg-852b0552f0.tar.gz"

          test -s \
            "_ffmpeg_core_source/FFmpeg-852b0552f0.tar.gz"

          ls -lh \
            "_ffmpeg_core_source/FFmpeg-852b0552f0.tar.gz"


      # ------------------------------------------------------
      # Create source bundle directory
      # ------------------------------------------------------

      - name: Create source bundle
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE_NAME="FFmpeg-BtbN-20260814-Sources"
          BUNDLE_ROOT="$GITHUB_WORKSPACE/_source_bundle/$BUNDLE_NAME"

          mkdir -p "$BUNDLE_ROOT"
          mkdir -p "$BUNDLE_ROOT/ffmpeg-source"
          mkdir -p "$BUNDLE_ROOT/dependency-sources"
          mkdir -p "$BUNDLE_ROOT/build-scripts"


          # --------------------------------------------------
          # Exact FFmpeg source
          # --------------------------------------------------

          cp \
            "$GITHUB_WORKSPACE/_ffmpeg_core_source/FFmpeg-852b0552f0.tar.gz" \
            "$BUNDLE_ROOT/ffmpeg-source/"


          # --------------------------------------------------
          # Dependency sources
          #
          # Copy only real files. BtbN additionally creates
          # symlinks without hashes; they point to the exact same
          # source archives and would only create duplicates.
          # --------------------------------------------------

          find \
            "$GITHUB_WORKSPACE/_ffmpeg_builds/.cache/downloads" \
            -type f \
            -name '*.tar.xz' \
            -exec cp {} "$BUNDLE_ROOT/dependency-sources/" \;


          # --------------------------------------------------
          # Exact BtbN build scripts
          #
          # Do not include Git metadata or downloaded cache.
          # --------------------------------------------------

          rm -rf \
            "$GITHUB_WORKSPACE/_ffmpeg_builds/.git"

          rm -rf \
            "$GITHUB_WORKSPACE/_ffmpeg_builds/.cache"

          cp -a \
            "$GITHUB_WORKSPACE/_ffmpeg_builds" \
            "$BUNDLE_ROOT/build-scripts/FFmpeg-Builds-590a661"


          # --------------------------------------------------
          # Our source identification
          # --------------------------------------------------

          cp \
            "$GITHUB_WORKSPACE/third_party_sources/ffmpeg/SOURCE_INFO.txt" \
            "$BUNDLE_ROOT/SOURCE_INFO.txt"


          # --------------------------------------------------
          # Notices and licenses
          # --------------------------------------------------

          cp \
            "$GITHUB_WORKSPACE/LICENSE" \
            "$BUNDLE_ROOT/LICENSE"

          cp \
            "$GITHUB_WORKSPACE/packaging/windows/THIRD_PARTY_NOTICES.txt" \
            "$BUNDLE_ROOT/THIRD_PARTY_NOTICES.txt"

          cp \
            "$GITHUB_WORKSPACE/packaging/windows/THIRD_PARTY_LICENSES.txt" \
            "$BUNDLE_ROOT/THIRD_PARTY_LICENSES.txt"


          # --------------------------------------------------
          # Source bundle README
          # --------------------------------------------------

          cat > "$BUNDLE_ROOT/README-SOURCES.txt" <<'EOF'
          FFmpeg / BtbN Source Bundle
          ===========================

          This source bundle accompanies a Yandex Music Downloader GUI
          Windows distribution containing the following FFmpeg build:

          Provider:
          BtbN / FFmpeg-Builds

          BtbN release:
          Auto-Build 2026-08-14 13:16

          BtbN release tag:
          autobuild-2026-08-14-13-16

          BtbN build scripts revision:
          590a6612d7d961e9258429e501619e0b7d7cbedf

          Variant:
          win64-lgpl-shared-8.1

          FFmpeg version:
          n8.1.2-40-g852b0552f0-20260814

          FFmpeg source revision:
          852b0552f0

          License:
          GNU Lesser General Public License version 3.0 (LGPLv3)


          Contents
          --------

          ffmpeg-source/
              Exact FFmpeg source archive corresponding to the
              distributed FFmpeg revision.

          dependency-sources/
              Source archives downloaded by the exact BtbN download
              scripts.

          build-scripts/
              Exact BtbN/FFmpeg-Builds revision used by the build,
              including scripts, patches and variants.

          LICENSE
              Application license.

          THIRD_PARTY_LICENSES.txt
              Full third-party license texts distributed with the
              application.

          SOURCE_INFO.txt
              Exact build and source identification.

          THIRD_PARTY_NOTICES.txt
              Third-party software notices.

          SHA256SUMS.txt
              SHA-256 hashes for files contained in this bundle.


          Dependency source scope
          -----------------------

          dependency-sources/ intentionally contains a conservative
          superset of source archives.

          BtbN download.sh processes the package definitions contained
          in scripts.d. Some downloaded source archives may therefore
          belong to optional components that were not enabled in the
          distributed win64-lgpl-shared-8.1 binary.

          These additional sources are deliberately retained so that
          source material referenced by the exact BtbN build system is
          not accidentally omitted.
          EOF

          sed -i \
            's/^          //' \
            "$BUNDLE_ROOT/README-SOURCES.txt"


          # --------------------------------------------------
          # SHA-256 manifest
          # --------------------------------------------------

          (
            cd "$BUNDLE_ROOT"

            find . \
              -type f \
              ! -name 'SHA256SUMS.txt' \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > SHA256SUMS.txt
          )


          # --------------------------------------------------
          # Diagnostics
          # --------------------------------------------------

          echo
          echo "Source bundle size:"
          du -sh "$BUNDLE_ROOT"

          echo
          echo "Source bundle directories:"
          find "$BUNDLE_ROOT" \
            -maxdepth 2 \
            -type d \
            | sort

          echo
          echo "Dependency source count:"
          find "$BUNDLE_ROOT/dependency-sources" \
            -type f \
            | wc -l


      # ------------------------------------------------------
      # ZIP
      #
      # Most source archives are already compressed .tar.xz,
      # so storing them without another expensive compression
      # pass is considerably faster.
      # ------------------------------------------------------

      - name: Create source ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/_source_bundle"

          zip \
            -0 \
            -r \
            "$GITHUB_WORKSPACE/FFmpeg-BtbN-20260814-Sources.zip" \
            "FFmpeg-BtbN-20260814-Sources"

          test -s \
            "$GITHUB_WORKSPACE/FFmpeg-BtbN-20260814-Sources.zip"

          echo
          echo "Source ZIP:"
          ls -lh \
            "$GITHUB_WORKSPACE/FFmpeg-BtbN-20260814-Sources.zip"

          echo
          echo "SHA-256:"
          sha256sum \
            "$GITHUB_WORKSPACE/FFmpeg-BtbN-20260814-Sources.zip"


      # ------------------------------------------------------
      # GitHub Actions artifact
      # ------------------------------------------------------

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: FFmpeg-BtbN-20260814-Sources
          path: FFmpeg-BtbN-20260814-Sources.zip
          compression-level: 0
          if-no-files-found: error
