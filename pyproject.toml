[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-music-downloader-gui"
dynamic = ["version"]
description = "GUI for downloading music from Yandex Music"
requires-python = ">=3.13"

dependencies = [
    "PySide6==6.11.1",
    "yandex-music==3.0.0",
    "mutagen>=1.47.0",
    "StrEnum",
    "pycryptodome",
    "requests>=2.31.0",
    "keyring>=25",
]

[project.scripts]
ymd-gui = "ymd_gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ymd*", "ymd_gui*"]

[tool.setuptools.package-data]
ymd_gui = [
    "resources/ffmpeg/windows/*.exe",
]

[tool.setuptools.dynamic]
version = {attr = "ymd_gui.__version__"}